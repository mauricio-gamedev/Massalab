name: Build MassaFF Lab APK

on:
  push:
    branches:
      - "feature/**"
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy SDK 'tools' package is no longer published.
          packages: 'platform-tools'

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source/MassaFF-Lab-source.tar.xz.b64.00 \
              source/MassaFF-Lab-source.tar.xz.b64.01 \
              source/MassaFF-Lab-source.tar.xz.b64.02 \
              source/MassaFF-Lab-source.tar.xz.b64.03 \
              source/MassaFF-Lab-source.tar.xz.b64.04 \
              | base64 --decode > MassaFF-Lab-source.tar.xz
          xz --test MassaFF-Lab-source.tar.xz
          tar -xJf MassaFF-Lab-source.tar.xz

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MassaFF-Lab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
