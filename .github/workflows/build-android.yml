name: Build MassaFF Lab APK

on:
  push:
    branches:
      - "feature/**"
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy SDK 'tools' package is no longer published.
          packages: 'platform-tools'

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source/MassaFF-Lab-source.tar.xz.b64.00 \
              source/MassaFF-Lab-source.tar.xz.b64.01 \
              source/MassaFF-Lab-source.tar.xz.b64.02 \
              source/MassaFF-Lab-source.tar.xz.b64.03 \
              source/MassaFF-Lab-source.tar.xz.b64.04 \
              | base64 --decode > MassaFF-Lab-source.tar.xz
          xz --test MassaFF-Lab-source.tar.xz
          tar -xJf MassaFF-Lab-source.tar.xz

      - name: Apply v0.2.0 stability and performance overlay
        shell: bash
        run: |
          set -euo pipefail
          cat \
              source/overlay-v0.2.0/part.00.b64 \
              source/overlay-v0.2.0/part.01.b64 \
              source/overlay-v0.2.0/part.02.b64 \
              source/overlay-v0.2.0/part.03.b64 \
              source/overlay-v0.2.0/part.04.b64 \
              source/overlay-v0.2.0/part.05.b64 \
              source/overlay-v0.2.0/part.06.b64 \
              source/overlay-v0.2.0/part.07.b64 \
              source/overlay-v0.2.0/part.08.b64 \
              source/overlay-v0.2.0/part.09.b64 \
              source/overlay-v0.2.0/part.10.b64 \
              source/overlay-v0.2.0/part.11.b64 \
              source/overlay-v0.2.0/part.12.b64 \
              source/overlay-v0.2.0/part.13.b64 \
              source/overlay-v0.2.0/part.14.b64 \
              source/overlay-v0.2.0/part.15.b64 \
              source/overlay-v0.2.0/part.16.b64 \
              source/overlay-v0.2.0/part.17.b64 \
              source/overlay-v0.2.0/part.18.b64 \
              source/overlay-v0.2.0/part.19.b64 \
              source/overlay-v0.2.0/part.20.b64 \
              source/overlay-v0.2.0/part.21.b64 \
              source/overlay-v0.2.0/part.22.b64 \
              source/overlay-v0.2.0/part.23.b64 \
              source/overlay-v0.2.0/part.24.b64 \
              source/overlay-v0.2.0/part.25.b64 \
              source/overlay-v0.2.0/part.26.b64 \
              | base64 --decode > /tmp/MassaFF-Lab-v0.2.0-overlay.zip
          unzip -t /tmp/MassaFF-Lab-v0.2.0-overlay.zip
          unzip -oq /tmp/MassaFF-Lab-v0.2.0-overlay.zip -d .

          # Keep every AIDL method explicitly numbered; Shizuku reserves destroy()'s transaction.
          install -D source/fixes/ITextureService.aidl app/src/main/aidl/io/github/astromg01/massaff/service/ITextureService.aidl

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MassaFF-Lab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
